name: Benachrichtigungen

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur Autobahn-Daten prüfen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "cryptography>=42"
      - name: Fällige Benachrichtigungen senden
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: python3 .github/scripts/send_push.py ${{ inputs.probe && '--probe' || '' }} | tee /tmp/out.txt
      - name: Prüfergebnis ablegen (nur Prüfmodus)
        if: ${{ inputs.probe }}
        run: |
          git config user.name arbeitstag-bot && git config user.email arbeitstag-bot@users.noreply.github.com
          git checkout --orphan probe && git rm -rfq . && cp /tmp/out.txt probe.txt && git add probe.txt
          git commit -qm probe && git push -fq origin probe
