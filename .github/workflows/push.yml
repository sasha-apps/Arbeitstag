name: Benachrichtigungen

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur Autobahn-Daten prüfen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "cryptography>=42"
      - name: Fällige Benachrichtigungen senden
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: python3 .github/scripts/send_push.py ${{ inputs.probe && '--probe' || '' }}
